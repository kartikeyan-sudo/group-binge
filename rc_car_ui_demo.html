<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RC Car Controller - UI Demo</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  color: #f1f5f9;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  max-width: 1200px;
  width: 100%;
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 2em;
  background: linear-gradient(135deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
}

/* Camera Feed Styling */
#video-container {
  position: relative;
  margin-bottom: 30px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  background: #1e293b;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 400px;
}

#video-placeholder {
  color: #64748b;
  font-size: 1.2em;
  text-align: center;
}

/* Main Controls Section */
.controls-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-bottom: 30px;
}

@media (max-width: 768px) {
  .controls-section {
    grid-template-columns: 1fr;
  }
}

/* Movement Controls - D-Pad Style */
.movement-controls {
  background: rgba(51, 65, 85, 0.5);
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
}

.movement-controls h3 {
  text-align: center;
  margin-bottom: 20px;
  color: #94a3b8;
  font-size: 1.2em;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  max-width: 300px;
  margin: 0 auto;
}

.dpad .btn {
  min-height: 80px;
  font-size: 1.1em;
  font-weight: 600;
}

.dpad .btn:nth-child(1) { grid-column: 2; }
.dpad .btn:nth-child(2) { grid-column: 1; }
.dpad .btn:nth-child(3) { grid-column: 2; }
.dpad .btn:nth-child(4) { grid-column: 3; grid-row: 2; }
.dpad .btn:nth-child(5) { grid-column: 2; }

/* Recording Controls */
.recording-controls {
  background: rgba(51, 65, 85, 0.5);
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
}

.recording-controls h3 {
  text-align: center;
  margin-bottom: 20px;
  color: #94a3b8;
  font-size: 1.2em;
}

.rec-buttons {
  display: grid;
  gap: 12px;
}

/* Button Styles */
.btn {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: #fff;
  padding: 15px 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-size: 1em;
  font-weight: 600;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(59, 130, 246, 0.5);
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.btn:active {
  transform: translateY(0);
  box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
}

.btn.stop-btn {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
}

.btn.stop-btn:hover {
  background: linear-gradient(135deg, #dc2626, #b91c1c);
  box-shadow: 0 6px 25px rgba(239, 68, 68, 0.5);
}

.btn.record-btn {
  background: linear-gradient(135deg, #10b981, #059669);
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}

.btn.record-btn:hover {
  background: linear-gradient(135deg, #059669, #047857);
  box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5);
}

.btn.stop-record-btn {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
}

.btn.stop-record-btn:hover {
  background: linear-gradient(135deg, #d97706, #b45309);
  box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5);
}

.btn.replay-btn {
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
}

.btn.replay-btn:hover {
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
}

.btn.clear-btn {
  background: linear-gradient(135deg, #64748b, #475569);
  box-shadow: 0 4px 15px rgba(100, 116, 139, 0.3);
}

.btn.clear-btn:hover {
  background: linear-gradient(135deg, #475569, #334155);
  box-shadow: 0 6px 25px rgba(100, 116, 139, 0.5);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Status Panel */
.status-panel {
  background: rgba(51, 65, 85, 0.5);
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.status-item {
  background: rgba(30, 41, 59, 0.6);
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  border: 1px solid rgba(148, 163, 184, 0.2);
}

.status-label {
  color: #94a3b8;
  font-size: 0.9em;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.status-value {
  font-size: 1.4em;
  font-weight: 700;
}

.status-value.on {
  color: #10b981;
  text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
}

.status-value.off {
  color: #64748b;
}

.rec-indicator {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ef4444;
  margin-right: 8px;
  animation: pulse 1.5s ease-in-out infinite;
  box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.rec-indicator.inactive {
  background: #475569;
  animation: none;
  box-shadow: none;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  .container {
    padding: 20px;
  }
  
  h2 {
    font-size: 1.5em;
  }
  
  .dpad .btn {
    min-height: 60px;
    font-size: 0.9em;
  }
  
  .status-grid {
    grid-template-columns: 1fr;
  }
}

/* Demo note */
.demo-note {
  text-align: center;
  margin-bottom: 20px;
  padding: 10px;
  background: rgba(59, 130, 246, 0.2);
  border-radius: 10px;
  border: 1px solid rgba(59, 130, 246, 0.3);
  color: #93c5fd;
}
</style>
</head><body>
<div class="container">
  <h2>🚗 RC Car Controller</h2>

  <div class="demo-note">
    <strong>UI Demo Mode</strong> - This is a static preview of the improved interface
  </div>

  <!-- Camera Feed -->
  <div id="video-container">
    <div id="video-placeholder">
      📹 Camera Feed<br>
      <small>(Connect to actual camera stream when deployed)</small>
    </div>
  </div>

  <!-- Main Controls -->
  <div class="controls-section">
    <!-- Movement Controls -->
    <div class="movement-controls">
      <h3>Movement Controls</h3>
      <div class="dpad">
        <button class="btn" onclick="demoClick(this, 'forward')">↑ Forward</button>
        <button class="btn" onclick="demoClick(this, 'left')">← Left</button>
        <button class="btn stop-btn" onclick="demoClick(this, 'stop')">■ Stop</button>
        <button class="btn" onclick="demoClick(this, 'right')">Right →</button>
        <button class="btn" onclick="demoClick(this, 'backward')">↓ Backward</button>
      </div>
    </div>

    <!-- Recording Controls -->
    <div class="recording-controls">
      <h3>Path Recording</h3>
      <div class="rec-buttons">
        <button class="btn record-btn" onclick="demoRecord()">● Start Recording</button>
        <button class="btn stop-record-btn" onclick="demoStopRecord()">■ Stop Recording</button>
        <button class="btn replay-btn" onclick="demoReplay()">⟲ Replay Path</button>
        <button class="btn clear-btn" onclick="demoClear()">⌫ Clear Path</button>
      </div>
    </div>
  </div>

  <!-- Status Panel -->
  <div class="status-panel">
    <div class="status-grid">
      <div class="status-item">
        <div class="status-label">Recording Status</div>
        <div class="status-value off" id="recStatus">
          <span class="rec-indicator inactive"></span>OFF
        </div>
      </div>
      <div class="status-item">
        <div class="status-label">Path Steps</div>
        <div class="status-value" id="pathLen">0</div>
      </div>
      <div class="status-item">
        <div class="status-label">Replay Status</div>
        <div class="status-value off" id="replayStatus">OFF</div>
      </div>
    </div>
  </div>
</div>

<script>
let isRecording = false;
let pathSteps = 0;
let isReplaying = false;

function demoClick(btn, action) {
  // Visual feedback
  btn.style.transform = 'scale(0.95)';
  setTimeout(() => {
    btn.style.transform = '';
  }, 100);
  
  if (isRecording) {
    pathSteps++;
    document.getElementById('pathLen').textContent = pathSteps;
  }
  
  console.log('Demo action:', action);
}

function demoRecord() {
  isRecording = true;
  const recStatus = document.getElementById('recStatus');
  recStatus.innerHTML = '<span class="rec-indicator"></span>ON';
  recStatus.classList.add('on');
  recStatus.classList.remove('off');
  console.log('Demo: Recording started');
}

function demoStopRecord() {
  isRecording = false;
  const recStatus = document.getElementById('recStatus');
  recStatus.innerHTML = '<span class="rec-indicator inactive"></span>OFF';
  recStatus.classList.add('off');
  recStatus.classList.remove('on');
  console.log('Demo: Recording stopped');
}

function demoReplay() {
  if (pathSteps === 0) {
    alert('No path recorded yet!');
    return;
  }
  
  isReplaying = true;
  const replayStatus = document.getElementById('replayStatus');
  replayStatus.textContent = 'ACTIVE';
  replayStatus.classList.add('on');
  replayStatus.classList.remove('off');
  
  console.log('Demo: Replaying path');
  
  // Simulate replay completion
  setTimeout(() => {
    isReplaying = false;
    replayStatus.textContent = 'OFF';
    replayStatus.classList.add('off');
    replayStatus.classList.remove('on');
    console.log('Demo: Replay complete');
  }, 3000);
}

function demoClear() {
  if (confirm('Clear all recorded path data?')) {
    pathSteps = 0;
    document.getElementById('pathLen').textContent = '0';
    console.log('Demo: Path cleared');
  }
}
</script>

</body></html>
